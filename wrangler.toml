#:schema node_modules/wrangler/config-schema.json
name = "rin-new"
main = "server/src/_worker.ts"
compatibility_date = "2025-03-21"

[assets]
directory = "./dist/client"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[triggers]
crons = ["*/20 * * * *"]

[vars]
S3_FOLDER = "images/"
S3_CACHE_FOLDER = "cache/"
S3_REGION = "auto"
S3_ENDPOINT = "https://placeholder.r2.cloudflarestorage.com"
S3_ACCESS_HOST = ""
S3_BUCKET = "placeholder-bucket"
S3_FORCE_PATH_STYLE = "false"
WEBHOOK_URL = ""
RSS_TITLE = "Rin Development"
RSS_DESCRIPTION = "Development Environment"
CACHE_STORAGE_MODE = "database"
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "admin123"

[[d1_databases]]
binding = "DB"
database_name = "rin-new"
database_id = "local"

[[queues.producers]]
binding = "TASK_QUEUE"
queue = "rin-new-tasks"

[[queues.consumers]]
queue = "rin-new-tasks"
max_batch_size = 1
max_batch_timeout = 5

